schema_version = "1.0.0"

id = "topology_patches"
version = "1.5.0"
name = "Topology Patches"
tagline = "Replace faces with the active mesh, stretched to fit and welded"
maintainer = "Matteo Fontana"
type = "add-on"
website = "https://github.com/mttfntn/topology-patches-blender"
tags = ["Mesh", "Modeling"]

# Supported: Blender 5.3.x only (max is exclusive).
blender_version_min = "5.3.0"
blender_version_max = "5.4.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Matteo Fontana"]

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", "/.*"]
