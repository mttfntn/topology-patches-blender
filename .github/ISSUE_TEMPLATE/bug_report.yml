name: Bug report
description: Something does not work as described in the README
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [Troubleshooting](https://github.com/mttfntn/topology-patches-blender#troubleshooting) section of the README first: a red preview usually means the faces under the cursor can't take the patch, and the header says why.

  - type: input
    id: blender
    attributes:
      label: Blender version
      description: Help › About Blender. Topology Patches supports Blender 5.3 only.
      placeholder: "5.3.0"
    validations:
      required: true

  - type: input
    id: addon
    attributes:
      label: Topology Patches version
      description: Edit › Preferences › Add-ons › Topology Patches
      placeholder: "1.5.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: patch
    attributes:
      label: The patch and the target
      description: >
        What kind of border the patch has (square, A × B, round with N vertices, other),
        which vertex groups it has (base, rigid), and the options you had on
        (Curve, Keep Rigid Shapes, Shrinkwrap to Original, UVs). The text in the
        viewport header while the tool runs helps too.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Starting from your scene, the exact clicks / keys that lead to the problem.
      placeholder: |
        1. Select the sphere, then the patch (active)
        2. Object › Topology Patches, → twice, left click
        3. ...
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or a .blend file
      description: Drag images here. A small .blend with the target and the patch helps most (zip it to attach it).

  - type: textarea
    id: console
    attributes:
      label: Error messages
      description: If Blender shows an error, copy it here (Window › Toggle System Console on Windows).
      render: shell
